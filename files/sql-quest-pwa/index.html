<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0fa3b1">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SQL Quest">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>SQL Quest – aprenda SQL jogando</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f8;--card:#fff;--ink:#14213d;--mut:#6b7a90;--line:#d5dee9;--pri:#0fa3b1;--priD:#0a7d88;--ok:#2ba84a;--okBg:#d9f5df;--bad:#e4572e;--badBg:#fde1d9;--gold:#f7b538;--code:#0b2545;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1726;--card:#17233a;--ink:#eaf0f8;--mut:#93a3bb;--line:#2a3a56;--okBg:#12351f;--badBg:#3d1e16;--code:#06101f}}
:root[data-theme="dark"]{--bg:#0e1726;--card:#17233a;--ink:#eaf0f8;--mut:#93a3bb;--line:#2a3a56;--okBg:#12351f;--badBg:#3d1e16;--code:#06101f}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-weight:600}
button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 140px}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:900;margin-bottom:20px}
.stat{display:flex;gap:14px}.stat span{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 12px}
h1{font-weight:900;font-size:30px;margin:0 0 4px}p.sub{color:var(--mut);margin:0 0 24px}
.path{display:flex;flex-direction:column;gap:18px;align-items:center}
.node{width:100%;max-width:420px;display:flex;align-items:center;gap:16px;background:var(--card);border:2px solid var(--line);border-bottom-width:6px;border-radius:20px;padding:14px 18px;text-align:left}
.node .ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:var(--pri);flex:none}
.node b{display:block;font-size:19px;font-weight:900}.node small{color:var(--mut)}
.node.done .ic{background:var(--ok)}.node.lock{opacity:.5;cursor:not-allowed}.node.lock .ic{background:var(--line)}
.node.cur{border-color:var(--pri)}
.node:nth-child(even){transform:translateX(18px)}.node:nth-child(odd){transform:translateX(-18px)}
@media (max-width:480px){.node:nth-child(n){transform:none}}
.lt{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.x{background:none;border:0;font-size:26px;color:var(--mut)}
.bar{flex:1;height:16px;background:var(--line);border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);border-radius:10px;transition:width .35s}
.hearts{font-weight:900;color:var(--bad)}
.q{font-size:24px;font-weight:900;margin:0 0 16px;line-height:1.3}
.tbl{overflow-x:auto;margin-bottom:18px}
.tbl small{color:var(--mut);display:block;margin-bottom:4px}
table{border-collapse:collapse;font-size:14px;background:var(--card);border-radius:10px;overflow:hidden}
th,td{border:1px solid var(--line);padding:5px 12px;text-align:left}th{background:var(--line)}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:14px 16px;margin-bottom:12px;font-size:17px}
.opt.sel{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 14%,var(--card))}
code,.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.slot{min-height:72px;background:var(--code);border-radius:16px;padding:12px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;margin-bottom:18px}
.bank{display:flex;flex-wrap:wrap;gap:8px;min-height:60px}
.tok{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:8px 12px}
.tok.used{visibility:hidden}
.slot .tok{border-color:var(--pri)}
.foot{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:2px solid var(--line)}
.foot.ok{background:var(--okBg)}.foot.bad{background:var(--badBg)}
.fin{max-width:608px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px}
.msg{font-weight:800;font-size:15px}.msg b{display:block;font-size:19px;font-weight:900}.ok .msg b{color:var(--ok)}.bad .msg b{color:var(--bad)}
.go{background:var(--pri);color:#fff;border:0;border-bottom:5px solid var(--priD);border-radius:16px;padding:13px 28px;font-weight:900;font-size:17px;min-width:130px}
.go:disabled{background:var(--line);border-bottom-color:var(--mut);color:var(--mut);cursor:not-allowed}
.ok .go{background:var(--ok);border-bottom-color:#1c7a34}.bad .go{background:var(--bad);border-bottom-color:#b0401f}
.ex{font-size:18px;line-height:1.55;margin:0 0 16px}.stage{background:var(--code);color:#e8f1ff;border-radius:18px;padding:16px;margin-bottom:14px}.stage pre{margin:0 0 12px;min-height:6.2em;white-space:pre-wrap;font-size:15px;color:#9be7ef}#tv{overflow-x:auto}#tv table{background:transparent;color:inherit}#tv th{background:#1d3557;color:#e8f1ff}#tv td,#tv th{border-color:#2a4a73}#tv tr,#tv td{transition:all .7s}#tv .ck{background:color-mix(in srgb,var(--ok) 45%,transparent)}#tv .cu{background:var(--gold);color:#14213d}#tv .rx{opacity:.2}#tv.pre .rx{opacity:1}#tv.pre .ra{opacity:0}#tv.pre .ck,#tv.pre .cu{background:transparent;color:inherit}.cap{margin:12px 0 0;min-height:1.4em;color:var(--gold);font-weight:800}.rp{background:none;border:2px solid var(--line);border-radius:14px;padding:8px 16px;font-weight:800;color:var(--pri)}.sh{margin:22px 0 10px;font-size:19px;font-weight:900}.subs{display:grid;grid-template-columns:1fr 1fr;gap:12px}.sb{display:flex;flex-direction:column;align-items:flex-start;gap:6px;background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:14px;text-align:left}.sb span{width:30px;height:30px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:900}.sb.dn span{background:var(--ok)}.sb b{font-weight:900}.sb small{color:var(--mut)}.end{text-align:center;padding-top:40px}.end .big{font-size:80px}.end h1{font-size:34px}
.res{display:flex;gap:14px;justify-content:center;margin:24px 0}.res div{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 20px;font-weight:900;font-size:22px}.res small{display:block;color:var(--mut);font-size:13px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const T={
clientes:{h:["id","nome","cidade","idade"],r:[[1,"Ana","São Paulo",28],[2,"Bruno","Rio de Janeiro",35],[3,"Carla","São Paulo",42],[4,"Davi","Curitiba",19]]},
pedidos:{h:["id","cliente_id","valor"],r:[[1,1,50],[2,3,120],[3,1,30],[4,2,80]]}};
const C=(q,o,e)=>({k:"c",q,o,e}),B=(q,a,x,e)=>({k:"b",q,a,x,e});
const L=[
{t:"Primeiros SELECTs",i:"🔍",tb:["clientes"],ex:[
C("Qual comando serve para buscar dados de uma tabela?",["SELECT","INSERT","DELETE","CREATE"],"SELECT lê dados. Os outros inserem, apagam ou criam."),
B("Monte a consulta para ver todos os nomes:",["SELECT","nome","FROM","clientes"],["WHERE","idade"],"SELECT escolhe a coluna e FROM diz de qual tabela."),
C("O que o * faz em SELECT * FROM clientes?",["Traz todas as colunas","Traz só a primeira linha","Apaga a tabela","Conta as linhas"],"O asterisco significa “todas as colunas”."),
B("Mostre nome e cidade dos clientes:",["SELECT","nome,","cidade","FROM","clientes"],["ORDER","*"],"Separe várias colunas com vírgula."),
C("Qual parte indica de qual tabela buscar?",["FROM","WHERE","SELECT","VALUES"],"FROM aponta a tabela de origem."),
B("Veja só as cidades:",["SELECT","cidade","FROM","clientes"],["WHERE","nome"],"Escreva o nome da coluna depois de SELECT."),
B("Veja só as idades:",["SELECT","idade","FROM","clientes"],["*","ORDER"],"Uma coluna só, sem vírgula."),
B("Veja todas as colunas:",["SELECT","*","FROM","clientes"],["nome","WHERE"],"O * traz tudo."),
C("Quantas linhas retorna SELECT nome FROM clientes?",["4","1","2","0"],"Sem filtro, vem uma linha para cada cliente: são 4."),
C("Quantas colunas retorna SELECT nome, idade FROM clientes?",["2","1","4","3"],"Cada coluna listada vira uma coluna no resultado."),
C("O que está errado em: SELECT nome clientes FROM?",["A ordem das palavras","Falta o asterisco","Falta o WHERE","Nada"],"A ordem correta é SELECT colunas FROM tabela."),
B("Veja id e nome:",["SELECT","id,","nome","FROM","clientes"],["cidade","*"],"As colunas saem na ordem em que você escreve."),
C("Qual consulta retorna só a coluna cidade?",["SELECT cidade FROM clientes","SELECT FROM cidade clientes","FROM clientes SELECT cidade","SELECT clientes FROM cidade"],"Modelo: SELECT coluna FROM tabela."),
C("O ponto e vírgula (;) no fim da consulta serve para:",["Indicar o fim do comando","Somar valores","Filtrar linhas","Comentar o código"],"Ele marca onde o comando termina."),
B("Veja nome, cidade e idade:",["SELECT","nome,","cidade,","idade","FROM","clientes"],["*","WHERE"],"Sem vírgula depois da última coluna."),
C("Qual o primeiro valor de SELECT nome FROM clientes?",["Ana","Bruno","Davi","Carla"],"As linhas vêm na ordem da tabela, e a primeira é a Ana."),
C("Para ver valores sem repetição, usamos:",["SELECT DISTINCT cidade","SELECT UNIQUE cidade","SELECT ONLY cidade","SELECT cidade DISTINCT"],"DISTINCT remove repetidos."),
C("Quantas linhas retorna SELECT DISTINCT cidade FROM clientes?",["3","4","2","1"],"São Paulo repete, então sobram 3 cidades."),
C("Como renomear a coluna nome para pessoa no resultado?",["SELECT nome AS pessoa","SELECT nome = pessoa","SELECT pessoa AS nome","SELECT nome TO pessoa"],"AS cria um apelido (alias)."),
B("Mostre o nome com o apelido pessoa:",["SELECT","nome","AS","pessoa","FROM","clientes"],["TO","*"],"Alias: coluna AS apelido.")]},
{t:"Filtrando com WHERE",i:"🎯",tb:["clientes"],ex:[
B("Clientes com mais de 30 anos:",["SELECT","*","FROM","clientes","WHERE","idade",">","30"],["<","ORDER"],"WHERE vem depois do FROM e filtra as linhas."),
C("Como filtrar a cidade igual a São Paulo?",["WHERE cidade = 'São Paulo'","WHERE cidade = São Paulo","WHERE cidade == 'São Paulo'","IF cidade = 'São Paulo'"],"Texto vai entre aspas simples e a comparação usa um único =."),
C("O que retorna: SELECT nome FROM clientes WHERE idade > 30?",["Bruno e Carla","Ana e Davi","Só Carla","Todos"],"Bruno tem 35 e Carla tem 42."),
C("Para exigir duas condições ao mesmo tempo, usamos:",["AND","OR","NOT IN","THEN"],"AND exige as duas. OR aceita qualquer uma."),
C("Qual operador significa diferente de?",["<>","=>","=!","=="],"<> (ou !=) significa diferente."),
B("Clientes de Curitiba:",["SELECT","*","FROM","clientes","WHERE","cidade","=","'Curitiba'"],["<>","idade"],"Texto entre aspas simples."),
C("O que retorna WHERE idade < 30?",["Ana e Davi","Bruno e Carla","Só Davi","Todos"],"Ana tem 28 e Davi tem 19."),
B("Clientes com 28 anos ou mais:",["SELECT","*","FROM","clientes","WHERE","idade",">=","28"],["<=","30"],">= significa maior ou igual."),
C("Quantas linhas: WHERE cidade = 'São Paulo' AND idade > 30?",["1","2","0","3"],"Só Carla mora em SP e tem mais de 30."),
C("Quantas linhas: WHERE cidade = 'Curitiba' OR idade > 40?",["2","1","3","0"],"Davi (Curitiba) e Carla (42)."),
B("Clientes que não moram em São Paulo:",["SELECT","*","FROM","clientes","WHERE","cidade","<>","'São Paulo'"],["=","AND"],"<> exclui o valor."),
C("Qual operador inverte uma condição?",["NOT","NO","!!","NEG"],"NOT nega a condição."),
C("Como achar valores vazios (nulos)?",["WHERE coluna IS NULL","WHERE coluna = NULL","WHERE coluna == 0","WHERE NULL coluna"],"NULL não se compara com =. Use IS NULL."),
B("Nomes de quem tem menos de 25 anos:",["SELECT","nome","FROM","clientes","WHERE","idade","<","25"],[">","*"],"< significa menor que.")]},
{t:"Ordenar e limitar",i:"📊",tb:["clientes"],ex:[
B("Do mais velho ao mais novo:",["SELECT","*","FROM","clientes","ORDER","BY","idade","DESC"],["ASC","LIMIT"],"DESC é decrescente."),
C("Qual palavra limita a quantidade de linhas?",["LIMIT","TOP BY","MAX","STOP"],"LIMIT 3 devolve no máximo 3 linhas."),
B("Os 2 primeiros nomes:",["SELECT","nome","FROM","clientes","LIMIT","2"],["ORDER","3"],"LIMIT fica no final da consulta."),
C("ORDER BY sem ASC ou DESC ordena de que forma?",["Crescente","Decrescente","Aleatória","Não ordena"],"O padrão é ASC (crescente)."),
B("Ordene pelo nome (A a Z):",["SELECT","*","FROM","clientes","ORDER","BY","nome"],["DESC","LIMIT"],"Texto ordena em ordem alfabética."),
C("Quem aparece primeiro em ORDER BY idade ASC?",["Davi","Ana","Bruno","Carla"],"Davi tem 19, a menor idade."),
C("Quem aparece primeiro em ORDER BY idade DESC?",["Carla","Davi","Ana","Bruno"],"Carla tem 42, a maior idade."),
B("O cliente mais novo (só 1):",["SELECT","*","FROM","clientes","ORDER","BY","idade","LIMIT","1"],["DESC","WHERE"],"Ordene do menor para o maior e pegue 1."),
C("A ordem certa das cláusulas é:",["WHERE, ORDER BY, LIMIT","LIMIT, WHERE, ORDER BY","ORDER BY, WHERE, LIMIT","WHERE, LIMIT, ORDER BY"],"Primeiro filtra, depois ordena e por último limita."),
B("Acima de 20 anos, do mais velho ao mais novo:",["SELECT","*","FROM","clientes","WHERE","idade",">","20","ORDER","BY","idade","DESC"],["ASC","LIMIT"],"WHERE vem antes de ORDER BY.")]},
{t:"Contando e somando",i:"🧮",tb:["clientes"],ex:[
C("Qual função conta linhas?",["COUNT(*)","SUM(*)","TOTAL()","LEN(*)"],"COUNT(*) conta quantas linhas existem."),
B("Média das idades:",["SELECT","AVG(idade)","FROM","clientes"],["SUM(idade)","WHERE"],"AVG calcula a média."),
B("Quantos clientes por cidade:",["SELECT","cidade,","COUNT(*)","FROM","clientes","GROUP","BY","cidade"],["ORDER","HAVING"],"GROUP BY cria um grupo por cidade."),
C("Resultado de SELECT COUNT(*) FROM clientes WHERE cidade = 'São Paulo'?",["2","1","3","4"],"Ana e Carla moram em São Paulo."),
B("Conte os clientes:",["SELECT","COUNT(*)","FROM","clientes"],["SUM(*)","WHERE"],"COUNT(*) conta linhas."),
C("Qual a soma das idades?",["124","31","4","100"],"28 + 35 + 42 + 19 = 124."),
B("A maior idade:",["SELECT","MAX(idade)","FROM","clientes"],["MIN(idade)","*"],"MAX pega o maior valor."),
C("SELECT MIN(idade) FROM clientes retorna:",["19","28","42","35"],"MIN pega o menor valor: 19."),
C("Qual cláusula filtra grupos depois do GROUP BY?",["HAVING","WHERE","LIMIT","FILTER"],"WHERE filtra linhas antes de agrupar. HAVING filtra os grupos."),
B("Quantos clientes têm mais de 30 anos:",["SELECT","COUNT(*)","FROM","clientes","WHERE","idade",">","30"],["SUM(*)","AVG(idade)"],"WHERE filtra e depois COUNT conta.")]},
{t:"Juntando tabelas",i:"🔗",tb:["clientes","pedidos"],ex:[
C("Para que serve o JOIN?",["Combinar linhas de duas tabelas","Apagar duplicados","Ordenar uma tabela","Criar um banco"],"JOIN liga tabelas por uma coluna em comum."),
B("Junte clientes e pedidos:",["SELECT","*","FROM","clientes","JOIN","pedidos","ON","clientes.id","=","pedidos.cliente_id"],["WHERE","UNION"],"ON diz qual coluna conecta as duas tabelas."),
C("Qual cliente aparece 2 vezes no JOIN com pedidos?",["Ana","Bruno","Carla","Davi"],"Ana tem os pedidos 1 e 3. Davi não tem pedido e some do INNER JOIN."),
B("Soma dos valores dos pedidos:",["SELECT","SUM(valor)","FROM","pedidos"],["COUNT(*)","AVG(valor)"],"SUM soma uma coluna numérica."),
B("Nome do cliente e valor do pedido:",["SELECT","clientes.nome,","pedidos.valor","FROM","clientes","JOIN","pedidos","ON","clientes.id","=","pedidos.cliente_id"],["WHERE","*"],"Use tabela.coluna para deixar claro de onde vem cada dado."),
C("Qual coluna liga as duas tabelas?",["pedidos.cliente_id","pedidos.valor","clientes.cidade","clientes.idade"],"cliente_id aponta para clientes.id (chave estrangeira)."),
C("Quantas linhas retorna o JOIN de clientes com pedidos?",["4","3","7","2"],"Cada um dos 4 pedidos encontra seu cliente."),
C("Qual JOIN mantém todos os clientes, mesmo sem pedidos?",["LEFT JOIN","INNER JOIN","RIGHT JOIN","CROSS JOIN"],"LEFT JOIN mantém todas as linhas da tabela da esquerda. O Davi apareceria com valor vazio.")]},
{t:"Inserindo dados",i:"➕",tb:["clientes"],ex:[
B("Insira o cliente Eva:",["INSERT","INTO","clientes","(nome,","idade)","VALUES","('Eva',","30)"],["SELECT","SET"],"INSERT INTO tabela (colunas) VALUES (valores)."),
C("Qual palavra introduz os valores a inserir?",["VALUES","SET","DATA","ADD"],"Depois de VALUES vêm os dados, na mesma ordem das colunas."),
C("Qual destes valores precisa de aspas simples?",["'Recife'","30","nome","VALUES"],"Textos usam aspas simples. Números não.")]},
{t:"Atualizar e apagar",i:"✏️",tb:["clientes"],ex:[
B("Mude a idade da Ana para 29:",["UPDATE","clientes","SET","idade","=","29","WHERE","nome","=","'Ana'"],["DELETE","FROM"],"UPDATE tabela SET coluna = valor WHERE condição."),
C("O que acontece se você esquecer o WHERE em um UPDATE?",["Todas as linhas são alteradas","Nada acontece","Dá erro","Só a primeira muda"],"Sem WHERE, a mudança vale para a tabela inteira. Cuidado!"),
B("Apague o cliente de id 4:",["DELETE","FROM","clientes","WHERE","id","=","4"],["DROP","SET"],"DELETE FROM apaga linhas, e o WHERE escolhe quais.")]},
{t:"Criando tabelas",i:"🏗️",tb:[],ex:[
C("Qual comando cria uma tabela nova?",["CREATE TABLE","NEW TABLE","MAKE TABLE","ADD TABLE"],"CREATE TABLE define o nome e as colunas."),
C("O que é uma PRIMARY KEY?",["Coluna que identifica cada linha de forma única","A primeira coluna da tabela","Uma senha do banco","Uma coluna só de texto"],"Não existem duas linhas com a mesma chave primária."),
B("Crie a tabela produtos com id e nome:",["CREATE","TABLE","produtos","(id","INTEGER","PRIMARY","KEY,","nome","TEXT)"],["INSERT","INTO"],"Cada coluna tem um nome e um tipo, separados por vírgula.")]},
{t:"Busca avançada",i:"🧭",tb:["clientes"],ex:[
C("O que faz WHERE nome LIKE 'A%'?",["Nomes que começam com A","Nomes que terminam com A","Nomes iguais a A","Nomes com uma letra"],"O % representa qualquer sequência de letras."),
B("Idades entre 20 e 40:",["SELECT","*","FROM","clientes","WHERE","idade","BETWEEN","20","AND","40"],["IN","OR"],"BETWEEN inclui os dois extremos."),
B("Clientes de São Paulo ou Curitiba:",["SELECT","*","FROM","clientes","WHERE","cidade","IN","('São Paulo',","'Curitiba')"],["BETWEEN","LIKE"],"IN aceita uma lista de valores.")]}
];
let S={done:0,xp:0,streak:1};
try{const s=JSON.parse(localStorage.getItem("sqlquest")||"null");if(s)S=s}catch(e){}
const save=()=>{try{localStorage.setItem("sqlquest",JSON.stringify(S))}catch(e){}};
const $=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const shuf=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(p=>p[1]);
let R=null;

function topbar(){return `<div class="top"><span>🧠 SQL Quest</span><div class="stat"><span>🔥 ${S.streak}</span><span>⚡ ${S.xp} XP</span></div></div>`}
function home(){clr();
 R=null;
 $.innerHTML=topbar()+`<h1>Aprenda SQL</h1><p class="sub">Lições curtas, uma de cada vez. Complete para destravar a próxima.</p><div class="path">`+
 L.map((l,i)=>{const st=i<S.done?"done":i==S.done?"cur":"lock";
 return `<button class="node ${st}" ${st=="lock"?"disabled":""} onclick="intro(${i})"><span class="ic">${st=="done"?"✓":st=="lock"?"🔒":l.i}</span><span><b>${l.t}</b><small>4 subtópicos · 20 exercícios${st=="done"?" · revisar":""}</small></span></button>`}).join("")+
 `</div>`;
}
function start(i,s){clr();const xs=exs(i,s);R={li:i,s,q:xs.map(e=>({...e})),n:0,hearts:5,right:0,tries:0,total:xs.length,sel:null,ans:[],bank:[],checked:false};setup();draw()}
function setup(){const e=R.q[0];R.sel=null;R.ans=[];R.checked=false;
 if(e.k=="b")R.bank=shuf([...e.a,...e.x].map((t,i)=>({t,i})));
 if(e.k=="c"){R.opts=shuf(e.o)}}
function tableHTML(){return L[R.li].tb.map(n=>{const t=T[n];return `<div class="tbl"><small class="mono">${n}</small><table><tr>${t.h.map(h=>`<th>${h}</th>`).join("")}</tr>${t.r.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`}).join("")}
function draw(fb){
 const e=R.q[0];let body="";
 body+=`<div class="lt"><button class="x" aria-label="Sair" onclick="home()">✕</button><div class="bar"><i style="width:${R.right/R.total*100}%"></i></div><span class="hearts">❤️ ${R.hearts}</span></div>`;
 body+=tableHTML()+`<p class="q">${esc(e.q)}</p>`;
 if(e.k=="c")body+=R.opts.map((o,i)=>`<button class="opt mono ${R.sel===o?"sel":""}" ${R.checked?"disabled":""} onclick="pick(${i})">${esc(o)}</button>`).join("");
